<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>IoT Security Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        body { background: #0f172a; color: #e2e8f0; }
        .card { background: #1e293b; border-color: #334155; }
        .stat-value { font-size: 2rem; font-weight: 700; }
        .stat-active    { color: #22c55e; }
        .stat-locked    { color: #f59e0b; }
        .stat-suspended { color: #ef4444; }
        .stat-alerts    { color: #ec4899; }
        .badge-ACTIVE    { background: #16a34a; }
        .badge-LOCKED    { background: #f59e0b; }
        .badge-SUSPENDED { background: #dc2626; }
        .badge-REVOKED   { background: #6b7280; }
        .table { --bs-table-bg: transparent; color: #e2e8f0; }
        .table thead th { color: #94a3b8; border-color: #334155; }
        .table td { border-color: #1e293b; }
        .nav-tabs .nav-link { color: #94a3b8; }
        .nav-tabs .nav-link.active { background: #1e293b; color: #e2e8f0; border-color: #334155; }
        code.log-event { color: #38bdf8; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark border-bottom border-secondary">
    <div class="container-fluid">
        <span class="navbar-brand">
            <i class="bi bi-shield-lock-fill text-primary"></i>
            IoT Security Dashboard
        </span>
        <div>
            <span class="text-secondary me-3 small" id="clock"></span>
            <a href="/logout" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-box-arrow-right"></i> خروج
            </a>
        </div>
    </div>
</nav>
<div class="container-fluid p-4">
    <div class="row g-3 mb-4">
        <div class="col-md-3"><div class="card p-3"><div class="text-secondary small">إجمالي الأجهزة</div><div class="stat-value" id="stat-total">-</div></div></div>
        <div class="col-md-3"><div class="card p-3"><div class="text-secondary small">نشطة (ACTIVE)</div><div class="stat-value stat-active" id="stat-active">-</div></div></div>
        <div class="col-md-3"><div class="card p-3"><div class="text-secondary small">مقفلة (LOCKED)</div><div class="stat-value stat-locked" id="stat-locked">-</div></div></div>
        <div class="col-md-3"><div class="card p-3"><div class="text-secondary small">تنبيهات (آخر ساعة)</div><div class="stat-value stat-alerts" id="stat-alerts">-</div></div></div>
    </div>
    <ul class="nav nav-tabs mb-3" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-devices"><i class="bi bi-hdd-network"></i> الأجهزة</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-live"><i class="bi bi-activity"></i> القراءات المباشرة</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-logs"><i class="bi bi-journal-text"></i> السجل الأمني</button></li>
    </ul>
    <div class="tab-content">
        <div class="tab-pane fade show active" id="tab-devices">
            <div class="card"><div class="card-body">
                <table class="table table-hover align-middle">
                    <thead><tr><th>DEVICE_ID</th><th>STATUS</th><th>FAILED</th><th>UPDATED</th><th>ACTIONS</th></tr></thead>
                    <tbody id="devices-tbody"></tbody>
                </table>
            </div></div>
        </div>
        <div class="tab-pane fade" id="tab-live">
            <div class="card"><div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-4"><label class="form-label">الجهاز:</label><select id="reading-device" class="form-select"></select></div>
                </div>
                <canvas id="chart-readings" height="100"></canvas>
            </div></div>
        </div>
        <div class="tab-pane fade" id="tab-logs">
            <div class="card"><div class="card-body">
                <div class="row mb-3 g-2">
                    <div class="col-md-4"><input type="text" id="log-filter-device" class="form-control" placeholder="Device ID (اختياري)"></div>
                    <div class="col-md-2"><button class="btn btn-primary w-100" onclick="loadLogs()"><i class="bi bi-search"></i> بحث</button></div>
                </div>
                <div style="max-height: 60vh; overflow-y: auto;">
                    <table class="table table-sm">
                        <thead><tr><th>TIMESTAMP</th><th>DEVICE</th><th>EVENT</th><th>DETAILS</th></tr></thead>
                        <tbody id="logs-tbody"></tbody>
                    </table>
                </div>
            </div></div>
        </div>
    </div>
</div>
<div class="modal fade" id="actionModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content bg-dark text-light border-secondary">
      <div class="modal-header border-secondary">
        <h5 class="modal-title" id="actionTitle">Action</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p id="actionDeviceInfo"></p>
        <div id="actionExtra" style="display:none">
          <label class="form-label">كلمة المرور الجديدة</label>
          <input type="text" id="actionPassword" class="form-control">
        </div>
      </div>
      <div class="modal-footer border-secondary">
        <button class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
        <button class="btn btn-danger" id="actionConfirm">تأكيد</button>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const api = async (url, opts) => { const r = await fetch(url, opts); return r.json(); };
const clock = () => { $('clock').textContent = new Date().toLocaleTimeString('ar-EG'); };
async function loadSummary() {
    const d = await api('/api/summary');
    $('stat-total').textContent = d.total_devices;
    $('stat-active').textContent = d.active;
    $('stat-locked').textContent = d.locked;
    $('stat-alerts').textContent = d.alerts_1h;
}
async function loadDevices() {
    const list = await api('/api/devices');
    const tbody = $('devices-tbody');
    tbody.innerHTML = '';
    const sel = $('reading-device');
    const current = sel.value;
    sel.innerHTML = '';
    list.forEach(d => {
        const tr = document.createElement('tr');
        tr.innerHTML = '<td><code>' + d.device_id + '</code></td>' +
            '<td><span class="badge badge-' + d.status + '">' + d.status + '</span></td>' +
            '<td>' + (d.failed_attempts || 0) + '</td>' +
            '<td>' + (d.updated_at ? new Date(d.updated_at).toLocaleString('ar-EG') : '-') + '</td>' +
            '<td>' +
              '<button class="btn btn-sm btn-success" onclick="doAction(\'reactivate\',\'' + d.device_id + '\')"><i class="bi bi-arrow-clockwise"></i></button> ' +
              '<button class="btn btn-sm btn-warning" onclick="doAction(\'suspend\',\'' + d.device_id + '\')"><i class="bi bi-pause-circle"></i></button> ' +
              '<button class="btn btn-sm btn-danger" onclick="doAction(\'revoke\',\'' + d.device_id + '\')"><i class="bi bi-x-octagon"></i></button> ' +
              '<button class="btn btn-sm btn-info" onclick="doAction(\'reset-credential\',\'' + d.device_id + '\')"><i class="bi bi-key"></i></button>' +
            '</td>';
        tbody.appendChild(tr);
        const opt = document.createElement('option');
        opt.value = d.device_id;
        opt.textContent = d.device_id;
        if (d.device_id === current) opt.selected = true;
        sel.appendChild(opt);
    });
}
async function loadLogs() {
    const device = $('log-filter-device').value.trim();
    const url = '/api/logs?limit=100' + (device ? '&device_id=' + encodeURIComponent(device) : '');
    const logs = await api(url);
    const tbody = $('logs-tbody');
    tbody.innerHTML = '';
    logs.forEach(row => {
        const tr = document.createElement('tr');
        tr.innerHTML = '<td class="small">' + new Date(row.timestamp).toLocaleString('ar-EG') + '</td>' +
            '<td><code>' + row.device_id + '</code></td>' +
            '<td><code class="log-event">' + row.event_type + '</code></td>' +
            '<td class="small text-secondary">' + (row.details || '') + '</td>';
        tbody.appendChild(tr);
    });
}
let chart = null;
async function loadReadings() {
    const device = $('reading-device').value;
    if (!device) return;
    const rows = await api('/api/readings?device_id=' + encodeURIComponent(device) + '&limit=60');
    const labels = rows.map(r => new Date(r.timestamp).toLocaleTimeString('ar-EG'));
    const temps = rows.map(r => r.temperature);
    const hums = rows.map(r => r.humidity);
    if (chart) chart.destroy();
    chart = new Chart($('chart-readings'), {
        type: 'line',
        data: { labels, datasets: [
            { label: 'Temperature (°C)', data: temps, borderColor: '#ef4444', backgroundColor: 'rgba(239,68,68,0.15)', tension: 0.3, fill: true },
            { label: 'Humidity (%)', data: hums, borderColor: '#38bdf8', backgroundColor: 'rgba(56,189,248,0.15)', tension: 0.3, fill: true }
        ]},
        options: {
            responsive: true,
            plugins: { legend: { labels: { color: '#e2e8f0' } } },
            scales: {
                x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
                y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
            }
        }
    });
}
let pendingAction = null;
const actionModal = new bootstrap.Modal($('actionModal'));
function doAction(action, deviceId) {
    pendingAction = { action, device_id: deviceId };
    const titles = { 'reactivate': 'إعادة تفعيل', 'suspend': 'تعليق الجهاز', 'revoke': 'إبطال الجهاز', 'reset-credential': 'إعادة تعيين كلمة المرور' };
    $('actionTitle').textContent = titles[action] || action;
    $('actionDeviceInfo').textContent = 'الجهاز: ' + deviceId;
    $('actionExtra').style.display = (action === 'reset-credential') ? 'block' : 'none';
    $('actionPassword').value = '';
    actionModal.show();
}
$('actionConfirm').addEventListener('click', async () => {
    if (!pendingAction) return;
    const body = Object.assign({}, pendingAction);
    if (pendingAction.action === 'reset-credential') {
        body.new_password = $('actionPassword').value;
        if (!body.new_password) { alert('أدخل كلمة المرور'); return; }
    }
    const res = await api('/api/action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
    });
    actionModal.hide();
    if (res.success) { loadDevices(); loadSummary(); loadLogs(); }
    else { alert('فشل: ' + (res.error || 'unknown')); }
});
async function refreshAll() { await Promise.all([loadSummary(), loadDevices(), loadLogs()]); }
document.addEventListener('DOMContentLoaded', () => {
    clock();
    setInterval(clock, 1000);
    refreshAll();
    setInterval(refreshAll, 3000);
    $('reading-device').addEventListener('change', loadReadings);
    setInterval(loadReadings, 3000);
});
</script>
</body>
</html>
